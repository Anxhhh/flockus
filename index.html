<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>flockus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="terminal" id="terminal">

  <pre class="boot" id="boot"></pre>

  <div id="app" class="hidden">

    <pre class="line">$ time</pre>
    <pre class="output" id="time">--:--</pre>

    <pre class="line">$ date</pre>
    <pre class="output" id="date">--</pre>

   <pre class="line">$ features</pre>
<pre class="hint">[1–5] brightness · F fullscreen · D dim · <a href="https://open.spotify.com/playlist/6zCID88oNjNv9zx6puDHKj?si=2ee12d11967340ab" target="_blank">spotify</a> · <a href="https://github.com/Anxhhh" target="_blank">developer ↗</a></pre>

  </div>
</main>

<script src="script.js"></script>
</body>
</html>
